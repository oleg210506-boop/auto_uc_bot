{% extends 'base.html' %}{% block content %}<h1>Заказы</h1><form class="filter" action="/orders"><label>Поиск по номеру, UID, покупателю<input name="q" value="{{ request.query_params.get('q','') }}"></label><label>Состояние<select name="state"><option value="">Все</option>{% for key,label in states.items() %}<option value="{{ key }}" {% if request.query_params.get('state')==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Данные<select name="mode"><option value="{{ 'demo' if mode=='demo' else 'live' }}">Текущий режим</option><option value="live">Live</option><option value="demo">Демо</option></select></label><button>Найти</button></form>{% include '_orders_table.html' %}<div class="actions"><span class="muted">Всего: {{ total }} · страница {{ page_number }}</span>{% if page_number>1 %}<a class="button" href="{{ request.url.include_query_params(page=page_number-1) }}">Назад</a>{% endif %}{% if total>page_number*50 %}<a class="button" href="{{ request.url.include_query_params(page=page_number+1) }}">Далее</a>{% endif %}<a class="button" href="/export.csv?{{ request.url.query }}">Экспорт CSV</a></div>{% endblock %}
