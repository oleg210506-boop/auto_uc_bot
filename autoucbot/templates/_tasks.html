{% if tasks %}<div class="card"><h2>Последние действия</h2><p class="hint">Обновите страницу, чтобы увидеть результат. Очередь выполняется сервером, даже когда панель закрыта.</p><div class="tablewrap"><table><thead><tr><th>ID / действие</th><th>Состояние</th><th>Результат</th></tr></thead><tbody>{% for t in tasks %}<tr><td>#{{ t.id }} · {{ t.kind }}</td><td>{{ t.state }}</td><td class="break">{{ t.result }}</td></tr>{% endfor %}</tbody></table></div></div>{% endif %}
